# Planterrella configuration for the simulation

mode = 3   # Mode of the planeterrella : 
# 0 = The needle and the small sphere
# 1 = The needle and two spheres        NOT IMPLEMENTED "yet"
# 2 = Two spheres, the smaller one ejecting the particles
# 3 = Two spheres, the larger one ejecting the particles

collisions = true  # enable collisions between electrons and gas molecules.

[Debug]
Plot_B_field = false # if true, will plot the B field lines instead, no simulation. 
Plot_E_field = false # if true, will plot the E field lines instead, no simulation.




[Simulation]
Nparticles = 500      # number of electros in the sim at step 0
Nsteps = 10000          # number of steps in the simulation
trajectoryStep = 10 # number of steps between each trajectory diagnostics recording

dt_ratio = 0.25     # dt = ratio_dt * cyclotron_T : dt is set to be a fraction of the electrons cyclotron period to capture the full physics. 
voltage = 300 # Voltage in Volts between the electrodes
emission_eV = 2.5 # energy of the electrons at step 0, increases with E field if enabled
E_field = 2      # 0: disable E field, 1: enable simple E field, 2: more precise E field


[Gas]
pressure = 5 # Pressure in Pa
temperature = 300 # Temperature in K
[[Gas.species]]
name = "N2"
fraction = 0.8
[[Gas.species]]
name = "O2"
fraction = 0.2

[SmallSphere]
R = 0.05    # Radius of the small sphere in meters
position = [0, 0.12, 0.2]   # Position of the small sphere in meters (x, y, z)
direction = [0, 0, 1]   # Direction vector of the small sphere (x, y, z)
dipole_moment = 250   # Dipole moment of the small sphere in A*m^2

[LargeSphere]
R = 0.1     # Radius of the large sphere in meters
position = [0, -0.1, 0.2]   # Position of the large sphere in meters (x, y, z)
direction = [0, 0.34202014332, 0.93969262078]   # Direction vector of the large sphere (x, y, z)
dipole_moment = 250   # Dipole moment of the large sphere in A*m^2

[Needle]
position = [0, 0, 0]   # Position of the needle in meters (x, y, z)
lc = 0.2    # Length of the cylinder part in meters
lb = 0.2   # Length of the conical part in meters
r = 0.005   # Radius of the needle in meters (the cylinder part)
direction = [0, 0, 1]   # Direction vector of the needle (x, y, z)

[Dome]
D = 0.5     # Diameter of the dome in meters
height = 1.0   # Height of the dome in meters